<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --accent-color: #ffc107;
            --light-bg: #f8f9fa;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px 0;
        }

        .reviews-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .reviews-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .reviews-header .lead {
            color: var(--secondary-color);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1rem;
        }

        .rating-summary {
            display: inline-block;
            background: white;
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: var(--card-shadow);
            margin-top: 10px;
        }

        .stars-container {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .carousel-container {
            position: relative;
            padding: 0 10px;
            overflow: hidden;
        }

        .review-card {
            background: white;
            border-radius: 15px;
            border: none;
            box-shadow: var(--card-shadow);
            height: 100%;
            transition: transform 0.3s ease, opacity 0.3s ease;
            padding: 15px;
            margin: 0 5px;
            display: flex;
            flex-direction: column;
        }

        .review-card:hover {
            transform: translateY(-5px);
        }

        .review-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .reviewer-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .reviewer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reviewer-info {
            flex-grow: 1;
            min-width: 0;
        }

        .reviewer-info h5 {
            margin: 0 0 3px 0;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .review-date {
            color: var(--secondary-color);
            font-size: 0.75rem;
            margin-bottom: 3px;
        }

        .review-rating-source {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .review-rating {
            color: var(--accent-color);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .source-logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .source-google {
            background-color: #4285f4;
        }

        .source-facebook {
            background-color: #1877f2;
        }

        .source-instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .source-tripadvisor {
            background-color: #34e0a1;
        }

        .review-content {
            color: #444;
            line-height: 1.4;
            margin-bottom: 15px;
            flex-grow: 1;
            font-size: 0.8rem;
            overflow: hidden;
        }

        .review-content.truncated {
            max-height: 70px;
            overflow: hidden;
            position: relative;
        }

        .review-content.truncated::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 25px;
            background: linear-gradient(to bottom, transparent, white);
        }

        .review-images {
            margin-top: 10px;
            flex-shrink: 0;
        }

        .review-image-container {
            border-radius: 8px;
            overflow: hidden;
            height: 55px;
            width: 55px;
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 5px;
            position: relative;
            cursor: pointer;
        }

        .review-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .review-image-container:hover img {
            transform: scale(1.1);
        }

        .image-counter {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.55rem;
            padding: 1px 4px;
            border-radius: 0 0 0 5px;
        }

        .read-more-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            font-size: 0.75rem;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .read-more-btn:hover {
            text-decoration: underline;
            color: #0a58ca;
        }

        .carousel-control-prev,
        .carousel-control-next {
            width: 35px;
            height: 35px;
            background-color: white;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            opacity: 1;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .carousel-control-prev {
            left: -15px;
        }

        .carousel-control-next {
            right: -15px;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(0.5);
            transition: filter 0.3s ease;
            width: 0.9rem;
            height: 0.9rem;
        }

        .carousel-control-prev:hover,
        .carousel-control-next:hover {
            background-color: var(--primary-color);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-control-prev:hover .carousel-control-prev-icon,
        .carousel-control-next:hover .carousel-control-next-icon {
            filter: invert(1);
        }

        .modal-content {
            border-radius: 15px;
            border: none;
            overflow: hidden;
        }

        .modal-header {
            border-bottom: 1px solid #dee2e6;
            padding: 20px 20px;
            background: white;
        }

        .modal-reviewer {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #f8f9fa;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-reviewer-info {
            flex-grow: 1;
        }

        .modal-reviewer-info .modal-title {
            margin: 0 0 5px 0;
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .modal-date {
            color: var(--secondary-color);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
        }

        .modal-rating-source {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }

        .modal-rating {
            color: var(--accent-color);
            font-size: 1rem;
        }

        .modal-source-logo {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .modal-image {
            border-radius: 10px;
            overflow: hidden;
            height: 120px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .modal-image:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .modal-image:hover img {
            transform: scale(1.05);
        }

        .image-preview-modal {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.9) !important;
        }

        .image-preview-modal .modal-dialog {
            max-width: 95vw;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .image-preview-modal .modal-content {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .image-preview-modal .modal-body {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-preview-modal .image-container {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-modal img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: imageFadeIn 0.5s ease-out;
        }

        @keyframes imageFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-photo-btn {
            position: absolute;
            top: 0px;
            right: 0px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .close-photo-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .modal-backdrop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            cursor: pointer;
        }

        .image-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: white;
            border: none;
            color: #333;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0.9;
        }

        .image-nav-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-50%) scale(1.1);
            opacity: 1;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .image-nav-btn.prev {
            left: 10px;
        }

        .image-nav-btn.next {
            right: 10px;
        }

        .image-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: translateY(-50%) scale(1);
        }

        .image-nav-btn:disabled:hover {
            background-color: white;
            color: #333;
            transform: translateY(-50%) scale(1);
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
        }

        .image-indicator {
            position: absolute;
            bottom: -35px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 1000;
        }

        .image-indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .image-indicator-dot.active {
            background: white;
            transform: scale(1.3);
        }

        .image-indicator-dot:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .carousel-indicators {
            bottom: -35px;
        }

        .carousel-indicators button {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ddd;
            border: none;
            margin: 0 4px;
        }

        .carousel-indicators button.active {
            background-color: var(--primary-color);
        }

        @media (max-width: 992px) {
            .carousel-inner .row {
                flex-wrap: nowrap;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scrollbar-width: none;
                -ms-overflow-style: none;
                margin: 0 -5px;
            }
            
            .carousel-inner .row::-webkit-scrollbar {
                display: none;
            }
            
            .carousel-inner .col {
                flex: 0 0 45%;
                max-width: 45%;
                scroll-snap-align: start;
                padding: 0 5px;
            }
            
            .review-card {
                margin: 0;
                opacity: 1 !important;
                transform: scale(1) !important;
                border: none !important;
            }
            
            .carousel-control-prev,
            .carousel-control-next {
                width: 30px;
                height: 30px;
            }
            
            .carousel-control-prev {
                left: -10px;
            }
            
            .carousel-control-next {
                right: -10px;
            }
            
            .carousel-control-prev-icon,
            .carousel-control-next-icon {
                width: 0.8rem;
                height: 0.8rem;
            }
            
            .modal-reviewer {
                gap: 12px;
            }
            
            .modal-avatar {
                width: 55px;
                height: 55px;
            }
            
            .modal-reviewer-info .modal-title {
                font-size: 1rem;
            }
            
            .modal-body {
                padding: 15px;
            }
            
            .modal-images-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }
            
            .modal-image {
                height: 100px;
            }
        }

        @media (max-width: 768px) {
            .reviews-header h1 {
                font-size: 1.5rem;
            }
            
            .reviews-header .lead {
                font-size: 0.9rem;
                padding: 0 15px;
            }
            
            .rating-summary {
                padding: 10px 20px;
            }
            
            .stars-container {
                font-size: 1.3rem;
            }
            
            .carousel-inner .col {
                flex: 0 0 65%;
                max-width: 65%;
            }
            
            .review-card {
                padding: 12px;
            }
            
            .reviewer-avatar {
                width: 40px;
                height: 40px;
            }
            
            .reviewer-info h5 {
                font-size: 0.85rem;
            }
            
            .review-date {
                font-size: 0.7rem;
            }
            
            .review-content {
                font-size: 0.78rem;
                line-height: 1.3;
            }
            
            .review-image-container {
                height: 50px;
                width: 50px;
            }
            
            .image-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .image-nav-btn.prev {
                left: 5px;
            }
            
            .image-nav-btn.next {
                right: 5px;
            }
            
            .close-photo-btn {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            
            .modal-header {
                padding: 15px;
            }
            
            .modal-body {
                padding: 15px;
            }
            
            .modal-images-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            
            .modal-image {
                height: 90px;
            }
        }

        @media (max-width: 576px) {
            .carousel-container {
                padding: 0 5px;
            }
            
            .carousel-inner .col {
                flex: 0 0 85%;
                max-width: 85%;
            }
            
            .review-card {
                padding: 10px;
            }
            
            .reviewer-avatar {
                width: 35px;
                height: 35px;
                margin-right: 8px;
            }
            
            .reviewer-info h5 {
                font-size: 0.8rem;
            }
            
            .review-date {
                font-size: 0.65rem;
            }
            
            .review-rating {
                font-size: 0.75rem;
            }
            
            .source-logo {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            
            .review-content {
                font-size: 0.75rem;
            }
            
            .review-content.truncated {
                max-height: 60px;
            }
            
            .review-image-container {
                height: 45px;
                width: 45px;
            }
            
            .read-more-btn {
                font-size: 0.7rem;
            }
            
            .carousel-control-prev,
            .carousel-control-next {
                display: none;
            }
            
            .modal-dialog {
                margin: 10px;
            }
            
            .modal-reviewer {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .modal-avatar {
                width: 70px;
                height: 70px;
                margin: 0 auto;
            }
            
            .modal-rating-source {
                justify-content: center;
            }
            
            .modal-images-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .modal-image {
                height: 80px;
            }
        }

        @media (max-width: 375px) {
            .carousel-inner .col {
                flex: 0 0 95%;
                max-width: 95%;
            }
            
            .reviews-header h1 {
                font-size: 1.3rem;
            }
            
            .reviews-header .lead {
                font-size: 0.85rem;
            }
            
            .rating-summary {
                padding: 8px 15px;
            }
            
            .stars-container {
                font-size: 1.2rem;
            }
            
            .review-card {
                padding: 8px;
            }
            
            .review-content {
                font-size: 0.7rem;
            }
            
            .modal-images-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-image {
                height: 120px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="reviews-header">
            <div class="rating-summary">
                <div class="stars-container" id="averageStars"></div>
                <div class="text-muted">
                    <span class="fw-bold text-primary" id="averageRating"></span> basé sur <span
                        id="reviewCount"></span> avis
                </div>
            </div>
        </div>

        <div class="carousel-container">
            <div id="reviewsCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
                <div class="carousel-inner" id="carouselInner"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#reviewsCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Précédent</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#reviewsCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Suivant</span>
                </button>
                <div class="carousel-indicators" id="carouselIndicators"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-reviewer">
                        <div class="modal-avatar">
                            <img id="modalProfilePic" src="" alt="">
                        </div>
                        <div class="modal-reviewer-info">
                            <h5 class="modal-title" id="modalReviewerName"></h5>
                            <span class="modal-date" id="modalDate"></span>
                            <div class="modal-rating-source">
                                <div class="modal-rating" id="modalRating"></div>
                                <div class="modal-source-logo" id="modalSourceLogo"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <p id="modalReviewContent" class="mb-4"></p>
                    <div id="modalImagesContainer" style="display: none;">
                        <h6 class="mb-3"><i class="fas fa-images me-2 text-primary"></i>Photos associées</h6>
                        <div class="modal-images-grid" id="modalImages"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade image-preview-modal" id="imagePreviewModal" tabindex="-1" aria-hidden="true"
        data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <button class="close-photo-btn" id="closePhotoBtn"><i class="fas fa-times"></i></button>
                    <div class="image-container" id="imageContainer">
                        <img id="previewImage" src="" alt="Aperçu de l'image">
                    </div>
                    <button class="image-nav-btn prev" id="prevImageBtn" style="display: none;"><i
                            class="fas fa-chevron-left"></i></button>
                    <button class="image-nav-btn next" id="nextImageBtn" style="display: none;"><i
                            class="fas fa-chevron-right"></i></button>
                    <div class="image-indicator" id="imageIndicator" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop-overlay" id="modalOverlay" style="display: none;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentImages = [], currentImageIndex = 0, imagePreviewModal = null, modalOverlay = null;
        let currentSlideIndex = 0;

        function abbreviateName(fullName) {
            const parts = fullName.split(' ');
            if (parts.length <= 1) return fullName;

            const firstName = parts[0];
            const lastNameInitial = parts[parts.length - 1].charAt(0) + '.';

            return `${firstName} ${lastNameInitial}`;
        }

        function calculateAverageRating() {
            const totalRating = reviews.reduce((sum, review) => sum + review.rating, 0);
            const average = totalRating / reviews.length;
            const roundedAverage = Math.round(average * 10) / 10;

            document.getElementById('reviewCount').textContent = reviews.length;
            document.getElementById('averageRating').textContent = `${roundedAverage}/5`;

            let starsHtml = '';
            const fullStars = Math.floor(roundedAverage);
            const hasHalfStar = roundedAverage % 1 >= 0.5;

            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
                else if (i === fullStars + 1 && hasHalfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                else starsHtml += '<i class="far fa-star"></i>';
            }

            document.getElementById('averageStars').innerHTML = starsHtml;
        }

        function getRelativeDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return "Aujourd'hui";
            if (diffDays === 1) return "Hier";
            if (diffDays < 7) return `Il y a ${diffDays} jours`;
            if (diffDays < 30) return `Il y a ${Math.floor(diffDays / 7)} semaine${Math.floor(diffDays / 7) > 1 ? 's' : ''}`;
            if (diffDays < 365) return `Il y a ${Math.floor(diffDays / 30)} mois`;
            return `Il y a ${Math.floor(diffDays / 365)} an${Math.floor(diffDays / 365) > 1 ? 's' : ''}`;
        }

        function generateStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) stars += '<i class="fas fa-star"></i>';
                else if (i === Math.ceil(rating) && !Number.isInteger(rating)) stars += '<i class="fas fa-star-half-alt"></i>';
                else stars += '<i class="far fa-star"></i>';
            }
            return stars;
        }

        function getSourceClass(source) {
            switch (source) {
                case 'google': return 'source-google';
                case 'facebook': return 'source-facebook';
                case 'instagram': return 'source-instagram';
                case 'tripadvisor': return 'source-tripadvisor';
                default: return 'source-google';
            }
        }

        function getSourceIcon(source) {
            switch (source) {
                case 'google': return '<i class="fab fa-google"></i>';
                case 'facebook': return '<i class="fab fa-facebook-f"></i>';
                case 'instagram': return '<i class="fab fa-instagram"></i>';
                case 'tripadvisor': return '<i class="fab fa-tripadvisor"></i>';
                default: return '<i class="fab fa-google"></i>';
            }
        }

        function generateCarousel() {
            const carouselInner = document.getElementById('carouselInner');
            const indicatorsContainer = document.getElementById('carouselIndicators');

            carouselInner.innerHTML = '';
            indicatorsContainer.innerHTML = '';

            if (window.innerWidth < 992) {
                const slide = document.createElement('div');
                slide.className = 'carousel-item active';
                const row = document.createElement('div');
                row.className = 'row g-3';

                reviews.forEach((review, reviewIndex) => {
                    const col = document.createElement('div');
                    col.className = 'col';

                    const showReadMore = review.content.length > 100;
                    const displayContent = showReadMore ? review.shortContent : review.content;
                    const relativeDate = getRelativeDate(review.date);
                    const sourceClass = getSourceClass(review.source);
                    const displayName = abbreviateName(review.name);

                    let imagesHTML = '';
                    if (review.images && review.images.length > 0) {
                        const imageCount = review.images.length;
                        const displayImages = review.images.slice(0, 2);

                        imagesHTML = `<div class="review-images">`;
                        displayImages.forEach((img, imgIndex) => {
                            imagesHTML += `
                                <div class="review-image-container" onclick="openImagePreview(${review.id}, ${imgIndex})">
                                    <img src="${img}" alt="Photo de l'avis">
                                    ${imgIndex === 1 && imageCount > 2 ? `<div class="image-counter">+${imageCount - 2}</div>` : ''}
                                </div>
                            `;
                        });
                        imagesHTML += `</div>`;
                    }

                    col.innerHTML = `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="reviewer-avatar">
                                    <img src="${review.profilePic}" alt="${review.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(review.name)}&background=0d6efd&color=fff&size=150'">
                                </div>
                                <div class="reviewer-info">
                                    <h5>${displayName}</h5>
                                    <div class="review-date">${relativeDate}</div>
                                </div>
                            </div>
                            <div class="review-rating-source">
                                <div class="review-rating">${generateStars(review.rating)}</div>
                                <div class="source-logo ${sourceClass}">
                                    ${getSourceIcon(review.source)}
                                </div>
                            </div>
                            <div class="review-content ${showReadMore ? 'truncated' : ''}">${displayContent}</div>
                            ${imagesHTML}
                            ${showReadMore ? `<button class="read-more-btn" onclick="openReviewModal(${review.id})"><i class="fas fa-external-link-alt me-1"></i>Lire la suite</button>` : ''}
                        </div>
                    `;

                    row.appendChild(col);
                });

                slide.appendChild(row);
                carouselInner.appendChild(slide);

                const indicator = document.createElement('button');
                indicator.type = 'button';
                indicator.dataset.bsTarget = '#reviewsCarousel';
                indicator.dataset.bsSlideTo = '0';
                indicator.className = 'active';
                indicator.ariaLabel = 'Slide 1';
                indicatorsContainer.appendChild(indicator);
            } else {
                const visibleItems = 5;
                const totalSlides = reviews.length;

                for (let slideIndex = 0; slideIndex < totalSlides; slideIndex++) {
                    const slide = document.createElement('div');
                    slide.className = `carousel-item ${slideIndex === 0 ? 'active' : ''}`;
                    const row = document.createElement('div');
                    row.className = 'row g-3 justify-content-center';

                    for (let i = -2; i <= 2; i++) {
                        const reviewIndex = (slideIndex + i + totalSlides) % totalSlides;
                        const review = reviews[reviewIndex];

                        const col = document.createElement('div');
                        col.className = 'col';
                        col.style.flex = '0 0 20%';
                        col.style.maxWidth = '20%';

                        const showReadMore = review.content.length > 100;
                        const displayContent = showReadMore ? review.shortContent : review.content;
                        const relativeDate = getRelativeDate(review.date);
                        const sourceClass = getSourceClass(review.source);
                        const displayName = abbreviateName(review.name);

                        let imagesHTML = '';
                        if (review.images && review.images.length > 0) {
                            const imageCount = review.images.length;
                            const displayImages = review.images.slice(0, 2);

                            imagesHTML = `<div class="review-images">`;
                            displayImages.forEach((img, imgIndex) => {
                                imagesHTML += `
                                    <div class="review-image-container" onclick="openImagePreview(${review.id}, ${imgIndex})">
                                        <img src="${img}" alt="Photo de l'avis">
                                        ${imgIndex === 1 && imageCount > 2 ? `<div class="image-counter">+${imageCount - 2}</div>` : ''}
                                    </div>
                                `;
                            });
                            imagesHTML += `</div>`;
                        }

                        const isCenter = i === 0;

                        col.innerHTML = `
                            <div class="review-card ${isCenter ? 'border-primary border-2' : ''}" style="${!isCenter ? 'opacity: 0.85; transform: scale(0.95);' : ''}">
                                <div class="review-header">
                                    <div class="reviewer-avatar">
                                        <img src="${review.profilePic}" alt="${review.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(review.name)}&background=0d6efd&color=fff&size=150'">
                                    </div>
                                    <div class="reviewer-info">
                                        <h5>${displayName}</h5>
                                        <div class="review-date">${relativeDate}</div>
                                    </div>
                                </div>
                                <div class="review-rating-source">
                                    <div class="review-rating">${generateStars(review.rating)}</div>
                                    <div class="source-logo ${sourceClass}">
                                        ${getSourceIcon(review.source)}
                                    </div>
                                </div>
                                <div class="review-content ${showReadMore ? 'truncated' : ''}">${displayContent}</div>
                                ${imagesHTML}
                                ${showReadMore ? `<button class="read-more-btn" onclick="openReviewModal(${review.id})"><i class="fas fa-external-link-alt me-1"></i>Lire la suite</button>` : ''}
                            </div>
                        `;

                        row.appendChild(col);
                    }

                    slide.appendChild(row);
                    carouselInner.appendChild(slide);

                    const indicator = document.createElement('button');
                    indicator.type = 'button';
                    indicator.dataset.bsTarget = '#reviewsCarousel';
                    indicator.dataset.bsSlideTo = slideIndex.toString();
                    indicator.className = slideIndex === 0 ? 'active' : '';
                    indicator.ariaLabel = `Slide ${slideIndex + 1}`;
                    indicatorsContainer.appendChild(indicator);
                }
            }

            currentSlideIndex = 0;
        }

        function setupCarouselEvents() {
            const carouselElement = document.getElementById('reviewsCarousel');

            carouselElement.addEventListener('slide.bs.carousel', function (event) {
                currentSlideIndex = event.to;

                if (window.innerWidth >= 992) {
                    setTimeout(() => {
                        const activeSlide = document.querySelector('.carousel-item.active');
                        if (activeSlide) {
                            const cards = activeSlide.querySelectorAll('.review-card');
                            cards.forEach((card, index) => {
                                if (index === 2) {
                                    card.classList.add('border-primary', 'border-2');
                                    card.style.opacity = '1';
                                    card.style.transform = 'scale(1)';
                                } else {
                                    card.classList.remove('border-primary', 'border-2');
                                    card.style.opacity = '0.85';
                                    card.style.transform = 'scale(0.95)';
                                }
                            });
                        }
                    }, 50);
                }
            });
        }

        function openReviewModal(reviewId) {
            const review = reviews.find(r => r.id === reviewId);
            if (!review) return;

            const modal = new bootstrap.Modal(document.getElementById('reviewModal'));

            document.getElementById('modalReviewerName').textContent = review.name;
            document.getElementById('modalProfilePic').src = review.profilePic;
            document.getElementById('modalDate').textContent = getRelativeDate(review.date);

            const ratingElement = document.getElementById('modalRating');
            const sourceLogoElement = document.getElementById('modalSourceLogo');

            ratingElement.innerHTML = generateStars(review.rating);

            sourceLogoElement.className = `modal-source-logo ${getSourceClass(review.source)}`;
            sourceLogoElement.innerHTML = getSourceIcon(review.source);

            document.getElementById('modalReviewContent').textContent = review.content;

            const imagesContainer = document.getElementById('modalImagesContainer');
            const imagesGrid = document.getElementById('modalImages');
            imagesGrid.innerHTML = '';

            if (review.images && review.images.length > 0) {
                review.images.forEach((image, index) => {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'modal-image';
                    imgContainer.innerHTML = `<img src="${image}" alt="Photo" onclick="openImagePreview(${review.id}, ${index})">`;
                    imagesGrid.appendChild(imgContainer);
                });
                imagesContainer.style.display = 'block';
            } else {
                imagesContainer.style.display = 'none';
            }

            modal.show();
        }

        function openImagePreview(reviewId, imageIndex) {
            const review = reviews.find(r => r.id === reviewId);
            if (!review || !review.images || review.images.length === 0) return;

            currentImages = review.images;
            currentImageIndex = imageIndex;

            if (!imagePreviewModal) {
                imagePreviewModal = new bootstrap.Modal(document.getElementById('imagePreviewModal'));
                modalOverlay = document.getElementById('modalOverlay');
                setupImageModalEvents();
            }

            updateImagePreview();
            imagePreviewModal.show();
            modalOverlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function updateImagePreview() {
            const previewImage = document.getElementById('previewImage');
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            const imageIndicator = document.getElementById('imageIndicator');

            if (currentImages.length > 0 && currentImageIndex < currentImages.length) {
                previewImage.src = currentImages[currentImageIndex];

                if (currentImages.length > 1) {
                    prevBtn.style.display = 'flex';
                    nextBtn.style.display = 'flex';
                    imageIndicator.style.display = 'flex';
                    prevBtn.disabled = currentImageIndex === 0;
                    nextBtn.disabled = currentImageIndex === currentImages.length - 1;
                    updateImageIndicator();
                } else {
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    imageIndicator.style.display = 'none';
                }
            }
        }

        function updateImageIndicator() {
            const imageIndicator = document.getElementById('imageIndicator');
            imageIndicator.innerHTML = '';

            for (let i = 0; i < currentImages.length; i++) {
                const dot = document.createElement('div');
                dot.className = `image-indicator-dot ${i === currentImageIndex ? 'active' : ''}`;
                dot.addEventListener('click', () => {
                    currentImageIndex = i;
                    updateImagePreview();
                });
                imageIndicator.appendChild(dot);
            }
        }

        function setupImageModalEvents() {
            const closeBtn = document.getElementById('closePhotoBtn');
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalElement = document.getElementById('imagePreviewModal');

            closeBtn.addEventListener('click', closeImagePreview);

            prevBtn.addEventListener('click', () => {
                if (currentImageIndex > 0) {
                    const imageContainer = document.getElementById('imageContainer');
                    imageContainer.style.opacity = '0.7';
                    imageContainer.style.transform = 'translateX(10px)';
                    setTimeout(() => {
                        currentImageIndex--;
                        updateImagePreview();
                        imageContainer.style.opacity = '1';
                        imageContainer.style.transform = 'translateX(0)';
                    }, 150);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentImageIndex < currentImages.length - 1) {
                    const imageContainer = document.getElementById('imageContainer');
                    imageContainer.style.opacity = '0.7';
                    imageContainer.style.transform = 'translateX(-10px)';
                    setTimeout(() => {
                        currentImageIndex++;
                        updateImagePreview();
                        imageContainer.style.opacity = '1';
                        imageContainer.style.transform = 'translateX(0)';
                    }, 150);
                }
            });

            modalOverlay.addEventListener('click', closeImagePreview);

            document.addEventListener('keydown', (e) => {
                if (modalElement.classList.contains('show') && e.key === 'Escape') closeImagePreview();

                if (modalElement.classList.contains('show')) {
                    if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
                        const imageContainer = document.getElementById('imageContainer');
                        imageContainer.style.opacity = '0.7';
                        imageContainer.style.transform = 'translateX(10px)';
                        setTimeout(() => {
                            currentImageIndex--;
                            updateImagePreview();
                            imageContainer.style.opacity = '1';
                            imageContainer.style.transform = 'translateX(0)';
                        }, 150);
                    } else if (e.key === 'ArrowRight' && currentImageIndex < currentImages.length - 1) {
                        const imageContainer = document.getElementById('imageContainer');
                        imageContainer.style.opacity = '0.7';
                        imageContainer.style.transform = 'translateX(-10px)';
                        setTimeout(() => {
                            currentImageIndex++;
                            updateImagePreview();
                            imageContainer.style.opacity = '1';
                            imageContainer.style.transform = 'translateX(0)';
                        }, 150);
                    }
                }
            });

            document.getElementById('previewImage').addEventListener('click', (e) => e.stopPropagation());
        }

        function closeImagePreview() {
            if (imagePreviewModal) {
                imagePreviewModal.hide();
                modalOverlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        function nextSlide() {
            currentSlideIndex = (currentSlideIndex + 1) % reviews.length;
            const carousel = bootstrap.Carousel.getInstance(document.getElementById('reviewsCarousel'));
            carousel.to(currentSlideIndex);
        }

        function prevSlide() {
            currentSlideIndex = (currentSlideIndex - 1 + reviews.length) % reviews.length;
            const carousel = bootstrap.Carousel.getInstance(document.getElementById('reviewsCarousel'));
            carousel.to(currentSlideIndex);
        }

        document.addEventListener('DOMContentLoaded', function () {
            calculateAverageRating();
            generateCarousel();
            setupCarouselEvents();

            const carousel = new bootstrap.Carousel(document.getElementById('reviewsCarousel'), {
                interval: 5000,
                ride: 'carousel',
                wrap: true
            });

            window.addEventListener('resize', generateCarousel);
        });
    </script>
</body>
