<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --accent-color: #ffc107;
            --light-bg: #f8f9fa;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px 0;
        }

        .reviews-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .reviews-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .reviews-header .lead {
            color: var(--secondary-color);
            max-width: 600px;
            margin: 0 auto;
        }

        .rating-summary {
            display: inline-block;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: var(--card-shadow);
            margin-top: 20px;
        }

        .stars-container {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .carousel-container {
            position: relative;
            padding: 0 50px;
        }

        @media (max-width: 768px) {
            .carousel-container { padding: 0 20px; }
        }

        .review-card {
            background: white;
            border-radius: 15px;
            border: none;
            box-shadow: var(--card-shadow);
            height: 100%;
            transition: transform 0.3s ease;
            padding: 25px;
            margin: 10px;
        }

        .review-card:hover { transform: translateY(-5px); }

        .review-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .reviewer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-right: 15px;
            flex-shrink: 0;
        }

        .reviewer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reviewer-info { flex-grow: 1; }

        .reviewer-info h5 {
            margin: 0 0 5px 0;
            color: #333;
            font-weight: 600;
        }

        .review-date {
            color: var(--secondary-color);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .review-rating { color: var(--accent-color); font-size: 0.9rem; }

        .review-source {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 5px;
        }

        .source-google { background-color: #4285f4; color: white; }
        .source-facebook { background-color: #1877f2; color: white; }
        .source-trustpilot { background-color: #00b67a; color: white; }
        .source-website { background-color: #6c757d; color: white; }

        .review-content {
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .review-content.truncated { max-height: 120px; overflow: hidden; }

        .review-images { margin-top: 15px; }

        .review-image-container {
            border-radius: 10px;
            overflow: hidden;
            height: 80px;
            width: 80px;
            display: inline-block;
            margin-right: 8px;
            margin-bottom: 8px;
            position: relative;
            cursor: pointer;
        }

        .review-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .review-image-container:hover img { transform: scale(1.1); }

        .image-counter {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 0 0 0 5px;
        }

        .carousel-control-prev, .carousel-control-next {
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            opacity: 1;
            transition: all 0.3s ease;
        }

        .carousel-control-prev { left: -25px; }
        .carousel-control-next { right: -25px; }

        .carousel-control-prev-icon, .carousel-control-next-icon {
            filter: invert(0.5);
            transition: filter 0.3s ease;
        }

        .carousel-control-prev:hover, .carousel-control-next:hover {
            background-color: var(--primary-color);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-control-prev:hover .carousel-control-prev-icon,
        .carousel-control-next:hover .carousel-control-next-icon { filter: invert(1); }

        .read-more-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }

        .read-more-btn:hover {
            text-decoration: underline;
            color: #0a58ca;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
            overflow: hidden;
        }

        .modal-header {
            border-bottom: 1px solid #dee2e6;
            padding: 20px 25px;
            background: white;
        }

        .modal-reviewer {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .modal-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #f8f9fa;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-body { padding: 25px; }

        .modal-rating {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .modal-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .modal-image {
            border-radius: 10px;
            overflow: hidden;
            height: 150px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .modal-image:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .modal-image:hover img { transform: scale(1.05); }

        .image-preview-modal {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.9) !important;
        }

        .image-preview-modal .modal-dialog {
            max-width: 95vw;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .image-preview-modal .modal-content {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .image-preview-modal .modal-body {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-preview-modal .image-container {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-modal img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: imageFadeIn 0.5s ease-out;
        }

        @keyframes imageFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-photo-btn {
            position: absolute;
            top: 0px;
            right: 0px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .close-photo-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .modal-backdrop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            cursor: pointer;
        }

        .image-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: none;
            color: #333;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0.9;
        }

        .image-nav-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-50%) scale(1.1);
            opacity: 1;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .image-nav-btn.prev { left: 20px; }
        .image-nav-btn.next { right: 20px; }

        .image-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: translateY(-50%) scale(1);
        }

        .image-nav-btn:disabled:hover {
            background-color: white;
            color: #333;
            transform: translateY(-50%) scale(1);
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
        }

        .image-indicator {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 1000;
        }

        .image-indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .image-indicator-dot.active {
            background: white;
            transform: scale(1.3);
        }

        .image-indicator-dot:hover { background: rgba(255, 255, 255, 0.6); }

        .carousel-indicators { bottom: -40px; }

        .carousel-indicators button {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ddd;
            border: none;
            margin: 0 5px;
        }

        .carousel-indicators button.active { background-color: var(--primary-color); }

        @media (max-width: 768px) {
            .image-nav-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .image-nav-btn.prev { left: 10px; }
            .image-nav-btn.next { right: 10px; }
            .close-photo-btn {
                top: 0px;
                right: 0px;
                width: 45px;
                height: 45px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .image-preview-modal img { border-radius: 8px; }
            .image-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .close-photo-btn {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reviews-header">
            <p class="lead">Découvrez ce que nos clients disent de nos services</p>
            <div class="rating-summary">
                <div class="stars-container" id="averageStars"></div>
                <div class="text-muted">
                    <span class="fw-bold text-primary" id="averageRating"></span> basé sur <span id="reviewCount"></span> avis
                </div>
            </div>
        </div>

        <div class="carousel-container">
            <div id="reviewsCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner" id="carouselInner"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#reviewsCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Précédent</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#reviewsCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Suivant</span>
                </button>
                <div class="carousel-indicators" id="carouselIndicators"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-reviewer">
                        <div class="modal-avatar">
                            <img id="modalProfilePic" src="" alt="">
                        </div>
                        <div>
                            <h5 class="modal-title mb-1" id="modalReviewerName"></h5>
                            <div class="modal-rating" id="modalRating"></div>
                            <div class="text-muted small" id="modalDate"></div>
                            <span id="modalSource" class="review-source"></span>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <p id="modalReviewContent" class="mb-4"></p>
                    <div id="modalImagesContainer" style="display: none;">
                        <h6 class="mb-3"><i class="fas fa-images me-2 text-primary"></i>Photos associées</h6>
                        <div class="modal-images-grid" id="modalImages"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade image-preview-modal" id="imagePreviewModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <button class="close-photo-btn" id="closePhotoBtn"><i class="fas fa-times"></i></button>
                    <div class="image-container" id="imageContainer">
                        <img id="previewImage" src="" alt="Aperçu de l'image">
                    </div>
                    <button class="image-nav-btn prev" id="prevImageBtn" style="display: none;"><i class="fas fa-chevron-left"></i></button>
                    <button class="image-nav-btn next" id="nextImageBtn" style="display: none;"><i class="fas fa-chevron-right"></i></button>
                    <div class="image-indicator" id="imageIndicator" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop-overlay" id="modalOverlay" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

        let currentImages = [], currentImageIndex = 0, imagePreviewModal = null, modalOverlay = null;

        function calculateAverageRating() {
            const totalRating = reviews.reduce((sum, review) => sum + review.rating, 0);
            const average = totalRating / reviews.length;
            const roundedAverage = Math.round(average * 10) / 10;
            
            document.getElementById('reviewCount').textContent = reviews.length;
            document.getElementById('averageRating').textContent = `${roundedAverage}/5`;
            
            let starsHtml = '';
            const fullStars = Math.floor(roundedAverage);
            const hasHalfStar = roundedAverage % 1 >= 0.5;
            
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
                else if (i === fullStars + 1 && hasHalfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                else starsHtml += '<i class="far fa-star"></i>';
            }
            
            document.getElementById('averageStars').innerHTML = starsHtml;
        }

        function getRelativeDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return "Aujourd'hui";
            if (diffDays === 1) return "Hier";
            if (diffDays < 7) return `Il y a ${diffDays} jours`;
            if (diffDays < 30) return `Il y a ${Math.floor(diffDays / 7)} semaine${Math.floor(diffDays / 7) > 1 ? 's' : ''}`;
            if (diffDays < 365) return `Il y a ${Math.floor(diffDays / 30)} mois`;
            return `Il y a ${Math.floor(diffDays / 365)} an${Math.floor(diffDays / 365) > 1 ? 's' : ''}`;
        }

        function generateStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) stars += '<i class="fas fa-star"></i>';
                else if (i === Math.ceil(rating) && !Number.isInteger(rating)) stars += '<i class="fas fa-star-half-alt"></i>';
                else stars += '<i class="far fa-star"></i>';
            }
            return stars;
        }

        function getSourceClass(source) {
            switch(source) {
                case 'google': return 'source-google';
                case 'facebook': return 'source-facebook';
                case 'trustpilot': return 'source-trustpilot';
                case 'website': return 'source-website';
                default: return 'source-website';
            }
        }

        function getSourceIcon(source) {
            switch(source) {
                case 'google': return '<i class="fab fa-google me-1"></i>';
                case 'facebook': return '<i class="fab fa-facebook-f me-1"></i>';
                case 'trustpilot': return '<i class="fas fa-star me-1"></i>';
                default: return '<i class="fas fa-globe me-1"></i>';
            }
        }

        function generateCarousel() {
            const carouselInner = document.getElementById('carouselInner');
            const indicatorsContainer = document.getElementById('carouselIndicators');
            
            carouselInner.innerHTML = '';
            indicatorsContainer.innerHTML = '';
            
            let itemsPerSlide = 3;
            if (window.innerWidth < 992) itemsPerSlide = 2;
            if (window.innerWidth < 768) itemsPerSlide = 1;
            
            const totalSlides = Math.ceil(reviews.length / itemsPerSlide);
            
            for (let slideIndex = 0; slideIndex < totalSlides; slideIndex++) {
                const slide = document.createElement('div');
                slide.className = `carousel-item ${slideIndex === 0 ? 'active' : ''}`;
                const row = document.createElement('div');
                row.className = 'row g-4';
                
                const startIndex = slideIndex * itemsPerSlide;
                const endIndex = Math.min(startIndex + itemsPerSlide, reviews.length);
                
                for (let i = startIndex; i < endIndex; i++) {
                    const review = reviews[i];
                    const col = document.createElement('div');
                    col.className = `col-md-${12 / itemsPerSlide}`;
                    
                    const showReadMore = review.content.length > 150;
                    const displayContent = showReadMore ? review.shortContent : review.content;
                    const relativeDate = getRelativeDate(review.date);
                    const sourceClass = getSourceClass(review.source);
                    
                    let imagesHTML = '';
                    if (review.images && review.images.length > 0) {
                        const imageCount = review.images.length;
                        const displayImages = review.images.slice(0, 3);
                        
                        imagesHTML = `<div class="review-images">`;
                        displayImages.forEach((img, imgIndex) => {
                            imagesHTML += `
                                <div class="review-image-container" onclick="openImagePreview(${review.id}, ${imgIndex})">
                                    <img src="${img}" alt="Photo de l'avis">
                                    ${imgIndex === 2 && imageCount > 3 ? `<div class="image-counter">+${imageCount - 3}</div>` : ''}
                                </div>
                            `;
                        });
                        imagesHTML += `</div>`;
                    }
                    
                    col.innerHTML = `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="reviewer-avatar">
                                    <img src="${review.profilePic}" alt="${review.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(review.name)}&background=0d6efd&color=fff&size=150'">
                                </div>
                                <div class="reviewer-info">
                                    <h5>${review.name}</h5>
                                    <div class="review-date">${relativeDate}</div>
                                    <div class="review-rating">${generateStars(review.rating)}</div>
                                    <span class="review-source ${sourceClass}">${getSourceIcon(review.source)}${review.sourceName}</span>
                                </div>
                            </div>
                            <div class="review-content ${showReadMore ? 'truncated' : ''}">${displayContent}</div>
                            ${imagesHTML}
                            ${showReadMore ? `<button class="read-more-btn" onclick="openReviewModal(${review.id})"><i class="fas fa-external-link-alt me-1"></i>Lire la suite</button>` : ''}
                        </div>
                    `;
                    
                    row.appendChild(col);
                }
                
                slide.appendChild(row);
                carouselInner.appendChild(slide);
                
                const indicator = document.createElement('button');
                indicator.type = 'button';
                indicator.dataset.bsTarget = '#reviewsCarousel';
                indicator.dataset.bsSlideTo = slideIndex.toString();
                indicator.className = slideIndex === 0 ? 'active' : '';
                indicator.ariaLabel = `Slide ${slideIndex + 1}`;
                indicator.addEventListener('click', () => {
                    document.querySelectorAll('#carouselIndicators button').forEach((btn, idx) => {
                        btn.classList.toggle('active', idx === slideIndex);
                    });
                });
                indicatorsContainer.appendChild(indicator);
            }
        }

        function openReviewModal(reviewId) {
            const review = reviews.find(r => r.id === reviewId);
            if (!review) return;
            
            const modal = new bootstrap.Modal(document.getElementById('reviewModal'));
            
            document.getElementById('modalReviewerName').textContent = review.name;
            document.getElementById('modalProfilePic').src = review.profilePic;
            document.getElementById('modalRating').innerHTML = generateStars(review.rating);
            document.getElementById('modalDate').textContent = getRelativeDate(review.date);
            document.getElementById('modalReviewContent').textContent = review.content;
            
            const sourceElement = document.getElementById('modalSource');
            sourceElement.className = `review-source ${getSourceClass(review.source)}`;
            sourceElement.innerHTML = `${getSourceIcon(review.source)}${review.sourceName}`;
            
            const imagesContainer = document.getElementById('modalImagesContainer');
            const imagesGrid = document.getElementById('modalImages');
            imagesGrid.innerHTML = '';
            
            if (review.images && review.images.length > 0) {
                review.images.forEach((image, index) => {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'modal-image';
                    imgContainer.innerHTML = `<img src="${image}" alt="Photo" onclick="openImagePreview(${review.id}, ${index})">`;
                    imagesGrid.appendChild(imgContainer);
                });
                imagesContainer.style.display = 'block';
            } else {
                imagesContainer.style.display = 'none';
            }
            
            modal.show();
        }

        function openImagePreview(reviewId, imageIndex) {
            const review = reviews.find(r => r.id === reviewId);
            if (!review || !review.images || review.images.length === 0) return;
            
            currentImages = review.images;
            currentImageIndex = imageIndex;
            
            if (!imagePreviewModal) {
                imagePreviewModal = new bootstrap.Modal(document.getElementById('imagePreviewModal'));
                modalOverlay = document.getElementById('modalOverlay');
                setupImageModalEvents();
            }
            
            updateImagePreview();
            imagePreviewModal.show();
            modalOverlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function updateImagePreview() {
            const previewImage = document.getElementById('previewImage');
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            const imageIndicator = document.getElementById('imageIndicator');
            
            if (currentImages.length > 0 && currentImageIndex < currentImages.length) {
                previewImage.src = currentImages[currentImageIndex];
                
                if (currentImages.length > 1) {
                    prevBtn.style.display = 'flex';
                    nextBtn.style.display = 'flex';
                    imageIndicator.style.display = 'flex';
                    prevBtn.disabled = currentImageIndex === 0;
                    nextBtn.disabled = currentImageIndex === currentImages.length - 1;
                    updateImageIndicator();
                } else {
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    imageIndicator.style.display = 'none';
                }
            }
        }

        function updateImageIndicator() {
            const imageIndicator = document.getElementById('imageIndicator');
            imageIndicator.innerHTML = '';
            
            for (let i = 0; i < currentImages.length; i++) {
                const dot = document.createElement('div');
                dot.className = `image-indicator-dot ${i === currentImageIndex ? 'active' : ''}`;
                dot.addEventListener('click', () => {
                    currentImageIndex = i;
                    updateImagePreview();
                });
                imageIndicator.appendChild(dot);
            }
        }

        function setupImageModalEvents() {
            const closeBtn = document.getElementById('closePhotoBtn');
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalElement = document.getElementById('imagePreviewModal');
            
            closeBtn.addEventListener('click', closeImagePreview);
            
            prevBtn.addEventListener('click', () => {
                if (currentImageIndex > 0) {
                    const imageContainer = document.getElementById('imageContainer');
                    imageContainer.style.opacity = '0.7';
                    imageContainer.style.transform = 'translateX(10px)';
                    setTimeout(() => {
                        currentImageIndex--;
                        updateImagePreview();
                        imageContainer.style.opacity = '1';
                        imageContainer.style.transform = 'translateX(0)';
                    }, 150);
                }
            });
            
            nextBtn.addEventListener('click', () => {
                if (currentImageIndex < currentImages.length - 1) {
                    const imageContainer = document.getElementById('imageContainer');
                    imageContainer.style.opacity = '0.7';
                    imageContainer.style.transform = 'translateX(-10px)';
                    setTimeout(() => {
                        currentImageIndex++;
                        updateImagePreview();
                        imageContainer.style.opacity = '1';
                        imageContainer.style.transform = 'translateX(0)';
                    }, 150);
                }
            });
            
            modalOverlay.addEventListener('click', closeImagePreview);
            
            document.addEventListener('keydown', (e) => {
                if (modalElement.classList.contains('show') && e.key === 'Escape') closeImagePreview();
                
                if (modalElement.classList.contains('show')) {
                    if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
                        const imageContainer = document.getElementById('imageContainer');
                        imageContainer.style.opacity = '0.7';
                        imageContainer.style.transform = 'translateX(10px)';
                        setTimeout(() => {
                            currentImageIndex--;
                            updateImagePreview();
                            imageContainer.style.opacity = '1';
                            imageContainer.style.transform = 'translateX(0)';
                        }, 150);
                    } else if (e.key === 'ArrowRight' && currentImageIndex < currentImages.length - 1) {
                        const imageContainer = document.getElementById('imageContainer');
                        imageContainer.style.opacity = '0.7';
                        imageContainer.style.transform = 'translateX(-10px)';
                        setTimeout(() => {
                            currentImageIndex++;
                            updateImagePreview();
                            imageContainer.style.opacity = '1';
                            imageContainer.style.transform = 'translateX(0)';
                        }, 150);
                    }
                }
            });
            
            document.getElementById('previewImage').addEventListener('click', (e) => e.stopPropagation());
        }

        function closeImagePreview() {
            if (imagePreviewModal) {
                imagePreviewModal.hide();
                modalOverlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            calculateAverageRating();
            generateCarousel();
            
            window.addEventListener('resize', generateCarousel);
            
            const carousel = new bootstrap.Carousel(document.getElementById('reviewsCarousel'), {
                interval: 5000,
                ride: 'carousel'
            });
        });
    </script>
</body>
</html>
